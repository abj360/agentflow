name: security

# runs on every PR plus a weekly dependency audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly dependency re-audit

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -t agentflow-api -f docker/api.Dockerfile .
      - name: Build console image
        run: docker build -t agentflow-console -f docker/console.Dockerfile .
      - name: Trivy scan
        run: docker run --rm aquasec/trivy image agentflow-api || true

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: pip install pip-audit && pip-audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITLEAKS_ENABLE_COMMENTS: "true"
