title = "agentflow gitleaks config"

# Without this, supplying a config replaces the built-in ruleset outright and
# the scan silently matches nothing -- a secret gate that always passes.
[extend]
useDefault = true

[allowlist]
description = "agentflow gitleaks allowlist"

# extend with care; every entry is a potential blind spot — keep minimal
# literal strings (''') keep regex backslashes out of TOML's escape handling
paths = [
    '''(?i)^\.env\.example$''',
]
