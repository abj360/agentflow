# MCP tool governance policy — evaluated before every governed tool call
version: 3
rules:
  - match: "search.*"
    action: allow
    risk: low
  - match: "fs.read"
    action: allow
    risk: low
  - match: "fs.write"
    action: human_approval
    risk: medium
  - match: "shell.*"
    action: human_approval
    risk: high
  - match: "db.write"
    action: human_approval
  - match: "db.read"
    action: allow
    risk: medium
  - match: "net.*"
    action: deny
    # egress is allowlisted at the sandbox layer too (defense in depth)
    risk: high
  - match: "*"
    action: deny
    risk: unknown


  - match: "metrics.*"
    action: allow
    risk: low


# per-tenant rule sets shadow the base `rules` when the tenant matches
tenant_overrides:
  acme:
    rules:
      - match: "db.*"
        action: allow
        risk: low
      - match: "*"
        action: deny
        risk: unknown


  globex:
    # security review 2026-05: shell stays denied for this tenant
    rules:
      - match: "shell.*"
        action: deny
        risk: high
      - match: "*"
        action: deny
        risk: unknown


  - match: "audit.read"
    action: allow
    risk: low


  initech:
    # per 2026-06 contract: everything not search.* needs sign-off
    rules:
      - match: "search.*"
        action: allow
      - match: "*"
        action: human_approval
        risk: medium


  - match: "config.read"
    action: allow
    risk: low


  - match: "admin.*"
    action: deny
    risk: critical


  - match: "report.*"
    action: human_approval
    risk: medium


  - match: "billing.*"
    action: deny
    risk: high


  - match: "deploy.*"
    action: human_approval
    risk: critical


  - match: "secrets.*"
    action: deny
    risk: critical


  - match: "backup.*"
    action: human_approval
    risk: high


  umbrella:
    # onboarded 2026-07: read-only access while in trial
    rules:
      - match: "search.*"
        action: allow
      - match: "fs.read"
        action: allow
      - match: "*"
        action: deny
        risk: unknown
