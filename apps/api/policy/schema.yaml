# MCP tool governance policy — evaluated before every governed tool call
version: 1
rules:
  - match: "search.*"
    action: allow
    risk: low
  - match: "fs.read"
    action: allow
    risk: low
  - match: "fs.write"
    action: human_approval
    risk: medium
  - match: "shell.*"
    action: human_approval
    risk: high
  - match: "db.*"
    action: human_approval
    risk: medium
  - match: "net.*"
    action: deny
    risk: high
  - match: "*"
    action: deny
    risk: unknown


  - match: "metrics.emit"
    action: allow
    risk: low


# per-tenant rule sets shadow the base `rules` when the tenant matches
tenant_overrides:
  acme:
    rules:
      - match: "db.*"
        action: allow
        risk: low
      - match: "*"
        action: deny
        risk: unknown


  globex:
    # security review 2026-05: shell stays denied for this tenant
    rules:
      - match: "shell.*"
        action: deny
        risk: high
      - match: "*"
        action: deny
        risk: unknown


  - match: "audit.read"
    action: allow
    risk: low


  initech:
    rules:
      - match: "search.*"
        action: allow
      - match: "*"
        action: human_approval
        risk: medium


  - match: "config.read"
    action: allow
    risk: low


  - match: "admin.*"
    action: deny
    risk: critical
