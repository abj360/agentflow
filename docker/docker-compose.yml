services:
  postgres:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  console:
    build:
      context: ..
      dockerfile: docker/console.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11
    ports:
      - "3001:3000"
    volumes:
      - ../infra/grafana:/var/lib/grafana/dashboards

volumes:
  pgdata:
