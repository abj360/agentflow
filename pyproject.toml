[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.12"
description = "Production multi-agent orchestrator with audit logging and MCP tool governance"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "langgraph>=0.2",
    "mcp>=1.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
    "prometheus-client>=0.20",
]

[tool.setuptools.packages.find]
include = ["apps*"]
namespaces = true

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "locust>=2.27",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = [".", "packages/core/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: exercises a real datastore rather than a fake",
]


[tool.coverage.run]
source = ["apps", "packages"]
omit = ["tests/*"]
